<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JUBO TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ── DARK THEME (기본) ── */
  :root {
    --bg: #0e0e11;
    --surface: #16161c;
    --surface2: #1e1e27;
    --border: #2a2a38;
    --accent: #b8f040;
    --accent2: #40c8f0;
    --text: #f0f0f8;
    --text2: #c0c0d8;
    --muted: #7a7a9a;
    --tab-h: 52px;
  }

  /* ── LIGHT THEME ── */
  [data-theme="light"] {
    --bg: #f5f5f0;
    --surface: #ffffff;
    --surface2: #eeeee8;
    --border: #d8d8d0;
    --accent: #2a7a00;
    --accent2: #006fa0;
    --text: #1a1a24;
    --text2: #3a3a50;
    --muted: #7a7a90;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background .25s, color .25s;
  }

  /* ── HEADER ── */
  header {
    padding: 28px 40px 0;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  /* ── THEME TOGGLE ── */
  .theme-btn {
    margin-left: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--muted);
    transition: background .2s, border-color .2s, color .2s;
    white-space: nowrap;
  }
  .theme-btn:hover { border-color: var(--accent2); color: var(--text); }
  .theme-icon { font-size: 14px; }

  /* ── SEARCH ── */
  .search-wrap {
    margin-left: auto;
    position: relative;
  }
  #search {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    padding: 8px 36px 8px 14px;
    width: 220px;
    outline: none;
    transition: border-color .2s, width .3s;
  }
  #search:focus { border-color: var(--accent2); width: 280px; }
  #search::placeholder { color: var(--muted); }
  .search-icon {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 14px; pointer-events: none;
  }

  /* ── TABS ── */
  .tab-bar {
    display: flex;
    gap: 0;
    padding: 0 40px;
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    border-bottom: 1px solid var(--border);
  }
  .tab-bar::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex-shrink: 0;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 0 20px;
    height: var(--tab-h);
    position: relative;
    transition: color .2s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
  }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }
  .tab-count {
    display: inline-block;
    background: var(--surface2);
    border-radius: 10px;
    font-size: 10px;
    padding: 1px 6px;
    margin-left: 6px;
    color: var(--muted);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
  }
  .tab-btn.active .tab-count { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }

  /* ── CONTENT ── */
  .content {
    padding: 32px 40px 60px;
    max-width: 1400px;
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── CATEGORY GROUP ── */
  .cat-group { margin-bottom: 40px; }
  .cat-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text2);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cat-label::before {
    content: '';
    width: 4px;
    height: 4px;
    background: var(--accent2);
    border-radius: 50%;
  }

  /* ── GRID ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }

  /* ── CARD ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: border-color .2s, transform .15s, background .2s;
    position: relative;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: transparent;
    transition: background .2s;
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--accent2) 40%, var(--border));
    background: var(--surface2);
    transform: translateY(-2px);
  }
  .card:hover::before { background: var(--accent2); }

  .card-title {
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .card-title .arrow {
    opacity: 0;
    color: var(--accent2);
    font-size: 12px;
    transition: opacity .2s, transform .2s;
    margin-top: 2px;
    flex-shrink: 0;
  }
  .card:hover .arrow { opacity: 1; transform: translateX(2px); }

  .card-desc {
    font-size: 12px;
    color: var(--text2);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-domain {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
    margin-top: auto;
  }

  .tab-bar, .card, header, .stats {
    transition: background .25s, border-color .25s, color .25s;
  }
  .no-results {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 13px;
    letter-spacing: 0.1em;
  }

  /* ── SEARCH HIGHLIGHT ── */
  .hidden { display: none !important; }
  mark {
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 1px;
  }

  /* ── STATS BAR ── */
  .stats {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 40px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 24px;
    align-items: center;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .stats span { color: var(--accent2); font-family: 'Syne', sans-serif; font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="logo">JUBO TOOLS</div>
  <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">
    <span class="theme-icon" id="themeIcon">☀️</span>

  </button>
  <div class="search-wrap">
    <input type="text" id="search" placeholder="검색..." autocomplete="off">
    <div class="search-icon">⌕</div>
  </div>
</header>

</div>

<div class="tab-bar" id="tabBar"></div>

<div class="content" id="content"></div>

const tabOrder = Object.keys(data);
const tabBar = document.getElementById('tabBar');
const content = document.getElementById('content');

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch { return url; }
}

function buildTabs() {
  tabOrder.forEach((tab, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.dataset.tab = tab;
    btn.innerHTML = `${tab} <span class="tab-count">${data[tab].length}</span>`;
    btn.addEventListener('click', () => switchTab(tab));
    tabBar.appendChild(btn);
  });
}

function buildContent() {
  tabOrder.forEach((tab, i) => {
    const panel = document.createElement('div');
    panel.className = 'tab-panel' + (i === 0 ? ' active' : '');
    panel.dataset.panel = tab;

    // Group by category
    const cats = {};
    data[tab].forEach(item => {
      const c = item.cat || '기타';
      if (!cats[c]) cats[c] = [];
      cats[c].push(item);
    });

    Object.entries(cats).forEach(([cat, items]) => {
      const group = document.createElement('div');
      group.className = 'cat-group';
      group.innerHTML = `<div class="cat-label">${cat}</div>`;
      const grid = document.createElement('div');
      grid.className = 'card-grid';
      items.forEach(item => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.dataset.title = item.title.toLowerCase();
        a.dataset.desc = item.desc.toLowerCase();
        a.dataset.cat = cat.toLowerCase();
        a.innerHTML = `
          <div class="card-title"><span class="title-text">${item.title}</span><span class="arrow">↗</span></div>
          ${item.desc ? `<div class="card-desc">${item.desc}</div>` : ''}
          <div class="card-domain">${getDomain(item.url)}</div>`;
        grid.appendChild(a);
      });
      group.appendChild(grid);
      panel.appendChild(group);
    });

    content.appendChild(panel);
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.dataset.panel === tab));
}

// Search
const searchInput = document.getElementById('search');
const searchCountEl = document.getElementById('search-count');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  let visible = 0;

  document.querySelectorAll('.card').forEach(card => {
    const match = !q || card.dataset.title.includes(q) || card.dataset.desc.includes(q) || card.dataset.cat.includes(q);
    card.classList.toggle('hidden', !match);
    if (match) visible++;

    // Highlight
    if (q) {
      const titleEl = card.querySelector('.title-text');
      const descEl  = card.querySelector('.card-desc');
      if (titleEl) titleEl.innerHTML = highlight(titleEl.textContent, q);
      if (descEl)  descEl.innerHTML  = highlight(descEl.textContent, q);
    } else {
      const titleEl = card.querySelector('.title-text');
      const descEl  = card.querySelector('.card-desc');
      if (titleEl) titleEl.innerHTML = card.dataset.title_orig || titleEl.textContent;
    }
  });

  // Hide empty cat-groups
  document.querySelectorAll('.cat-group').forEach(g => {
    const hasVisible = [...g.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
    g.classList.toggle('hidden', !hasVisible);
  });

  // Activate tab that has results if searching
  if (q) {
    let found = false;
    tabOrder.forEach(tab => {
      const panel = document.querySelector(`[data-panel="${tab}"]`);
      const hasResults = panel && [...panel.querySelectorAll('.card')].some(c => !c.classList.contains('hidden'));
      if (hasResults && !found) { switchTab(tab); found = true; }
    });
    searchCountEl.style.display = 'inline';
    searchCountEl.textContent = visible + '개';
    document.getElementById('search-count').parentElement.style.display = '';
  } else {
    searchCountEl.style.display = 'none';
    document.querySelectorAll('.cat-group').forEach(g => g.classList.remove('hidden'));
  }
});

function highlight(text, q) {
  if (!q) return text;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

buildTabs();
buildContent();

// Update total
const total = Object.values(data).reduce((s, arr) => s + arr.length, 0);
document.getElementById('total-count').textContent = total;

// Theme toggle
function toggleTheme() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeLabel').textContent = '라이트';
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeIcon').textContent = '🌙';
    document.getElementById('themeLabel').textContent = '다크';
  }
}
</script>
